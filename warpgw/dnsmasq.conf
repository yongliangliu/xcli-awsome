# warpgw local DNS cache — cuts repeated-lookup latency from ~500ms (WARP tunnel) to <5ms
# Managed by xcli warpgw. Deploy: cp to /usr/local/etc/dnsmasq.conf && sudo brew services restart dnsmasq
# Client opt-in: set the device's DNS to this Mac's LAN IP (e.g. 192.168.1.105).

# Bind to en0's current address dynamically (no hardcoded IP; loopback left to WARP's 127.0.2.x)
interface=en0
except-interface=lo0
bind-interfaces
port=53

# Upstream: Cloudflare and Google (routed through WARP/utun0 = poison-proof)
server=1.1.1.1
server=8.8.8.8

# Don't read system resolv.conf (WARP overrides it with 127.0.2.x)
no-resolv
no-poll

# Aggressive caching for low-latency repeated lookups
cache-size=1500
# Force minimum 5-min cache even for short-TTL records (YouTube uses 60s TTL)
min-cache-ttl=300

# Security
no-hosts
bogus-priv
domain-needed
